# CI — push/PR 自动测试 + 构建校验
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: |
          npm install
          cd client && npm install && cd ..

      - name: 前端构建
        run: npm run build

      - name: 运行测试
        run: npm test
