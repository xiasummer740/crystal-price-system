appId: com.crystal.price-system
productName: 晶振报价管理系统
beforePack: "scripts/clean-dist.js"
directories:
  output: dist-exe
  buildResources: build
files:
  - electron/**/*
  - server/**/*
  - client/dist/**/*
  - package.json
asarUnpack:
  - "**/*.node"
  - "node_modules/electron-updater/**"
extraResources:
  - from: scripts
    to: scripts
win:
  icon: client/public/SJK-256.png
  # 本程序不签名（无代码签名证书）。显式声明可让 electron-builder 跳过
  # winCodeSign 工具的下载与解压 —— 那个 7z 里含 macOS 的符号链接（.dylib），
  # 在未开「开发者模式」的非管理员环境下解压会失败：
  #   ERROR: Cannot create symbolic link : 客户端没有所需的特权
  # 从而整包构建失败。关掉签名后不再需要该工具。
  sign: false
  forceCodeSigning: false
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
portable:
  artifactName: 晶振报价管理系统-便携版-v${version}.exe
nsis:
  artifactName: crystal-price-system-setup-${version}.${ext}
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 晶振报价管理系统
  uninstallDisplayName: 晶振报价管理系统
  include: build/installer.nsh

publish:
  - provider: github
    owner: xiasummer740
    repo: crystal-price-system
