appId: com.crystal.price-system
productName: 晶振报价管理系统
beforePack: "scripts/clean-dist.js"
directories:
  output: dist-exe
  buildResources: build
files:
  - electron/**/*
  - server/**/*
  - client/dist/**/*
  - package.json
asarUnpack:
  - "**/*.node"
  - "node_modules/electron-updater/**"
extraResources:
  - from: scripts
    to: scripts
win:
  icon: client/public/SJK-256.png
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
portable:
  artifactName: 晶振报价管理系统-便携版-v${version}.exe
nsis:
  artifactName: crystal-price-system-setup-${version}.${ext}
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 晶振报价管理系统
  uninstallDisplayName: 晶振报价管理系统
  include: build/installer.nsh

publish:
  - provider: github
    owner: xiasummer740
    repo: crystal-price-system
